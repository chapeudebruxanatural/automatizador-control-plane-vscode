criticalGap:
  from: lead
  to: revenue
  description: >-
    As tres etapas finais (proposta, fechamento, receita) foram DECLARADAS como
    objetivo de mensuracao, mas nao ha confirmacao de sistema que as registre
    nem de mecanismo que as devolva ao Google Ads.
  consequence: >-
    Sem o retorno do resultado, o Google Ads otimiza para LEAD, nao para
    RECEITA. Para um artista com poucos shows de alto valor, essa diferenca
    define se a campanha da lucro: cem leads baratos que nao fecham valem menos
    que tres que contratam.
  whatWouldClose:
    - CRM que registre proposta, fechamento e valor
    - Identificador de clique (GCLID) capturado no formulario e guardado
    - Import de conversao offline para o Google Ads
    - Valor monetario associado a conversao
  verificationStatus: requires_live_verification

unknowns:
  - Qual CRM e usado, se existe algum
  - Se o GCLID e capturado e armazenado no lead
  - Se ha valor monetario associado a conversao
  - Ciclo medio entre lead e fechamento
  - Taxa de conversao de cada etapa
  - Ticket medio

controlPlaneCapability:
  canRead: false
  canWrite: false

nextSteps:
