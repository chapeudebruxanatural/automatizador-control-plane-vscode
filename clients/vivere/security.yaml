    severity: alta
    status: requires_live_verification
    reportedAt: 2026-08-05
    reportedBy: proprietario
    summary: >-
      Um segredo TOTP (chave de configuracao de MFA) da conta
      contato.automatizadoria@gmail.com teria sido exposto em uma captura de
      tela anterior, feita em algum momento do trabalho neste cliente.
    scope: >-
      A conta exposta e contato.automatizadoria@gmail.com — a conta
      CANONICA da AutomatizadorIA, nao uma conta do cliente Vivere. Este
      incidente e registrado no contexto do Vivere porque foi relatado durante
      o handoff deste projeto, mas o IMPACTO REAL e sobre a operacao
      AutomatizadorIA como um todo, nao especificamente sobre este cliente.
      Ver docs/security/access-matrix.md para o registro da conta.
    secretRegistered: false
    secretRegisteredNote: >-
      O valor do TOTP NAO foi registrado em nenhum lugar deste repositorio,
      nem parcialmente, nem mascarado. Por instrucao explicita: nao registrar
      o segredo.
    actionsTaken: nenhuma
    actionsTakenNote: >-
      Por instrucao explicita: NAO revogar o fator nesta fase. O incidente e
      apenas REGISTRADO para tratamento posterior deliberado.
    whyNotRevokedNow: >-
      Revogar um fator MFA e acao com efeito colateral real sobre acesso a
      conta — pode bloquear quem depende dele legitimamente se feito sem
      coordenacao. Trata-se de decisao humana, Nivel 2, nao de reflexo
      automatico a uma mencao de incidente.
    recommendedAction:
      - Confirmar com o dono se a captura de tela ainda existe e onde
      - Se confirmada a exposicao, revogar o TOTP e reconfigurar o MFA
      - Verificar historico de acesso da conta contato.automatizadoria@gmail.com
        por atividade incomum
      - Registrar a resolucao em DECISIONS.md
    approvalLevel: 2
    verificationStatus: requires_live_verification

