  Operacao propria. Presta servicos de automacao, sites e trafego para os demais
  clientes deste catalogo. E tambem a entidade que opera este Control Plane.

projects:
  - slug: control-plane
    name: Control Plane
    description: Este repositorio. Inventario, contexto e automacao da operacao.
    status: em-desenvolvimento
    verificationStatus: verified

  - slug: site-de-conformidade
    name: Site de conformidade e branding
    description: >-
      Site exigido para verificacao do Google OAuth e da Google Ads API.
      Necessario para publicar integracoes Google fora do modo de teste.
    status: ativo
    verificationStatus: discovered

confirmedRepositories:
  - automatizador-control-plane

likelyRepositories:
  - name: automatizadoria-compliance-site
    reason: >-
      A descricao do proprio repositorio cita "Automatizador IA" e o proposito
      (Google OAuth / Google Ads API).
    verificationStatus: discovered

domains:
  - domain: automatizadoria.cloud
    purpose: unknown
    registrar: unknown
    dns: unknown
    verificationStatus: discovered
    lastVerifiedAt: 2026-08-04
    note: >-
      Observado como aba aberta no navegador durante o diagnostico de acessos
      em 2026-08-04, com o titulo "Automatizador IA". E um indicio, nao uma
      confirmacao: nao foi checado contra registrador, DNS nem Cloudflare.
      Confirmar antes de tratar como dominio de producao.

accounts:
