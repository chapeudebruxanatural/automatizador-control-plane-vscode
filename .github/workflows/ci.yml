name: CI

# Valida o Control Plane em toda mudança que possa chegar à main.
#
# Este workflow NÃO tem acesso a nenhum sistema externo: sem secrets, sem VPS,
# sem Cloudflare, sem n8n, sem Google Ads, sem WhatsApp. Ele só executa o que
# roda em qualquer máquina com o repositório e o package-lock.json — que é
# exatamente o que a validação precisa ser para ser confiável.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'

# Menor privilégio: o job só precisa ler o código. Nenhuma escrita em nada —
# nem em issues, nem em packages, nem em deployments, nem em status.
permissions:
  contents: read

# Uma execução por ref. Um push novo cancela a validação anterior da mesma
# branch, que já está obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validação (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Uma versão quebrada não deve esconder o resultado da outra.
      fail-fast: false
      matrix:
        # Os dois extremos da faixa declarada em `engines` do package.json.
        # Testar só uma ponta já custou caro: o script de teste usava glob do
        # `node --test`, que só existe a partir do Node 21 — passava no Node 24
        # do desenvolvedor e quebrava no mínimo declarado. Bug encontrado pelo
        # próprio CI, na primeira execução.
        node: ['20.11.0', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Só o commit em validação. Histórico completo não é necessário e
          # aumentaria o tempo de clone sem benefício.
          fetch-depth: 1
          persist-credentials: false

      - name: Configurar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          # Versões fixas em vez de 'lts/*': uma mudança de LTS não pode
          # quebrar o CI sem ninguém ter mexido no projeto.
          node-version: ${{ matrix.node }}
          # Cache do npm chaveado pelo package-lock.json — invalida sozinho
          # quando a árvore de dependências muda.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        # `npm ci` e não `npm install`: respeita o lockfile exatamente e falha
        # se package.json e package-lock.json estiverem inconsistentes. É a
        # diferença entre validar o que será instalado e validar outra coisa.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Varredura de segredos
        # Última etapa de propósito: se algo falhou antes, o segredo eventual
        # é o menor dos problemas. Se tudo passou, esta é a porta final.
        run: npm run scan:secrets:all
