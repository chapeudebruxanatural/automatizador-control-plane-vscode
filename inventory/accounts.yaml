# =============================================================================
# inventory/accounts.yaml — contas e acessos
# =============================================================================
# Registra EXISTENCIA, FINALIDADE, PERMISSAO e LOCAL DE ARMAZENAMENTO.
# NUNCA registra valor de autenticacao: sem token, sem senha, sem chave.
#
# IDs numericos de conta de anuncios e enderecos de e-mail administrativos NAO
# sao segredo — sao metadados operacionais. Ver docs/security/secrets-policy.md.
#
# Leitura narrativa: docs/security/access-matrix.md
# =============================================================================

meta:
  collectedAt: 2026-08-04
  verificationStatus: verified
  scope: >-
    Acessos disponiveis na estacao de trabalho do dono em 2026-08-04, apurados
    por diagnostico direto de cada ferramenta.

# =============================================================================
# REGRA DE SEPARACAO DAS CONTAS GOOGLE
# =============================================================================
accountSeparationPolicy:
  canonical:
    account: contato.automatizadoria@gmail.com
    scope: AutomatizadorIA — operacao de servicos e clientes
  separate:
    account: estudionovacena@gmail.com
    scope: Novacena — producao audiovisual e musical
  rule: >-
    NAO misturar arquivos, e-mails, agendas, contatos ou recursos entre as duas
    contas. Nenhuma automacao pode ler de uma e escrever na outra. A conta e
    parametro obrigatorio de toda operacao Google, e a implementacao deve
    recusar operacao entre contas diferentes.
  source: instrucao explicita do dono em 2026-08-04
  status: EM CONFLITO — ver accounts[google-drive-connector]

