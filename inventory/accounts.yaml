accounts:
  # ---------------------------------------------------------------------------
  - id: github-dadocruz
    platform: GitHub
    account: dadocruz
    purpose: Todos os repositorios da operacao
    client: automatizadoria
    permissions: { read: true, write: true, create: true, delete: false }
    scopes: [gist, "read:org", repo, workflow]
    authSource: gh CLI (OAuth)
    storage: keychain do macOS
    status: ativo
    risk: medio
    riskDetail: >-
      Token com escrita em todos os repositorios, inclusive os de clientes.
      Nao possui delete_repo nem admin:org, o que limita o dano maximo.
      Ponto unico: uma conta, uma pessoa, sem redundancia.
    requiredAction: >-
      Avaliar token de escopo reduzido para uso do Control Plane, separado do
      token pessoal de uso diario.
    verificationStatus: verified
    lastVerifiedAt: 2026-08-04

  # ---------------------------------------------------------------------------
  - id: vps-hostinger
    platform: Hostinger VPS
    account: root@automatizadoria (alias SSH nvvps)
    purpose: Infraestrutura de producao — 13 stacks, 28 servicos
    client: automatizadoria
    permissions: { read: true, write: true, create: true, delete: true }
    permissionsNote: >-
      O ACESSO tecnico permite tudo. A POLITICA restringe a leitura. A diferenca
      entre os dois e disciplina, e disciplina falha — por isso o coletor
      (scripts/collect-vps-inventory.sh) recusa comandos mutantes em codigo.
    authSource: chave SSH sem senha
    storage: ~/.ssh (fora do repositorio, nunca lida)
    status: ativo
    risk: alto
    riskDetail: >-
      Acesso root direto e sem senha. Nao existe erro de digitacao inofensivo.
      A chave nao tem passphrase: quem obtiver o arquivo obtem producao inteira.
    requiredAction: >-
      Criar usuario nao-root com permissao somente leitura para inventario
      recorrente. Avaliar passphrase na chave e uso de ssh-agent.
    verificationStatus: verified
    lastVerifiedAt: 2026-08-04

