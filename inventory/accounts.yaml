  - id: google-drive-connector
    platform: Google Drive (conector do Claude)
    account: INDETERMINADO
    purpose: Leitura e criacao de arquivos
    client: CONFLITANTE
    permissions: { read: true, write: true, create: true, delete: false }
    authSource: conector OAuth do Claude
    storage: infraestrutura do Claude
    status: ativo
    risk: ALTO
    riskDetail: >-
      CONFLITO DE SEPARACAO. Gmail e Calendar respondem pela conta Novacena
      (estudionovacena@gmail.com), mas a listagem de arquivos recentes do Drive
      devolveu arquivos de propriedade de contato.automatizadoria@gmail.com.
      Nao foi possivel determinar por qual das duas contas o conector autentica:
      pode ser a conta AutomatizadorIA, ou a conta Novacena enxergando arquivos
      compartilhados. Em qualquer das hipoteses, uma unica sessao alcanca
      recursos das duas contas — exatamente o que a regra proibe.
    requiredAction: >-
      RESOLVER ANTES DE QUALQUER AUTOMACAO GOOGLE. Determinar a conta de
      autenticacao do conector e, se necessario, reconecta-lo com escopo unico.
    verificationStatus: conflicting
    lastVerifiedAt: 2026-08-04

