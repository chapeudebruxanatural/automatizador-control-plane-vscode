schemaVersion: 1
policy:
  visibilityRequired: private
  namingPattern: dadocruz/cliente-<slug>-ops
  executionRepository: dadocruz/automatizador-control-plane
  note: >-
    O workspace guarda memória e contexto de um cliente. Credenciais,
    allowlists, execução, kill switch, aprovação e auditoria permanecem no
    control plane. Repositório desejado não é repositório existente: actual
    continua null até confirmação pela API ou interface do GitHub.

