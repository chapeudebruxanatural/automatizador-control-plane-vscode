meta:
  collectedAt: 2026-08-09
  note: >-
    "readiness" descreve o quanto o Control Plane pode integrar HOJE.
    GitHub, VPS, Cloudflare e n8n estao ativos em codigo exclusivamente para
    leitura. Meta foi adiada pelo dono.

integrations:
  - id: github
    platform: GitHub
    purpose: Repositorios, workflows e automacao de codigo
    authSource: gh CLI (token no keychain do macOS)
    account: dadocruz
    scopes: [gist, "read:org", repo, workflow]
    read: true
    write: true
    delete: false
    readiness: pronto (somente leitura)
    controlPlaneAdapter: GitHubReadAdapter real sobre gh CLI
    verificationStatus: verified
    lastVerifiedAt: 2026-08-09
    notes: >-
      Adaptador real validado contra a conta: 14 repositorios, 6 privados e 8
      publicos. Owner fixado em dadocruz; nao usa shell, nao recebe token e nao
      expoe criar, editar, arquivar ou apagar. Associacao a cliente continua
      fora do adaptador e nunca e inferida pela API.

  - id: vps-ssh
    platform: Hostinger VPS
    purpose: Infraestrutura de producao
    authSource: chave SSH em ~/.ssh (alias nvvps)
    account: root@automatizadoria
    read: true
    write: false
    delete: false
    readiness: pronto (somente leitura)
    controlPlaneAdapter: VpsReadAdapter real com tres operacoes fixas
    verificationStatus: verified
    lastVerifiedAt: 2026-08-09
    notes: >-
      Acesso atual ainda e root, risco aceito temporariamente pelo dono. O
      adaptador nao aceita comando arbitrario: le apenas host, docker ps e
      docker stack ls. Leitura ao vivo: Debian 11, 197 dias de uptime, disco
      47%, 32 containers running, zero unhealthy e 13 stacks.

