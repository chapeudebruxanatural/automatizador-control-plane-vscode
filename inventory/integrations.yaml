recommendedOrder:
  - { step: 1, integration: cloudflare, reason: "Token barato, destrava o mapa dominio -> cliente" }
  - { step: 2, integration: n8n, reason: "Remove o maior ponto cego operacional" }
  - { step: 3, integration: github, reason: "Ja pronto; formaliza o que hoje e script" }
