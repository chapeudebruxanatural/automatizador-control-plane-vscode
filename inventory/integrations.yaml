meta:
  collectedAt: 2026-08-08
  note: >-
    "readiness" descreve o quanto o Control Plane pode integrar HOJE.
    Nenhuma integracao esta ativa em codigo — todos os adaptadores sao
    contratos com implementacao simulada.

integrations:
  - id: github
    platform: GitHub
    purpose: Repositorios, workflows e automacao de codigo
    authSource: gh CLI (token no keychain do macOS)
    account: dadocruz
    scopes: [gist, read:org, repo, workflow]
    read: true
    write: true
    delete: false
    readiness: pronto
    controlPlaneAdapter: GitHubAdapter (contrato + mock)
    verificationStatus: verified
    lastVerifiedAt: 2026-08-08
    notes: >-
      Unica integracao ja exercitada de ponta a ponta: este repositorio foi
      criado e publicado por ela. Ausencia de delete_repo e admin:org e uma boa
      restricao — o token nao consegue apagar repositorio.

  - id: vps-ssh
    platform: Hostinger VPS
    purpose: Infraestrutura de producao
    authSource: chave SSH em ~/.ssh (alias nvvps)
    account: root@automatizadoria
    read: true
    write: false
    delete: false
    readiness: pronto (somente leitura)
    controlPlaneAdapter: VpsAdapter (contrato + mock)
    verificationStatus: verified
    lastVerifiedAt: 2026-08-08
    notes: >-
      Acesso root. O adaptador real deve usar LISTA BRANCA de comandos, nao
      lista negra: lista branca falha fechada, lista negra falha aberta.

