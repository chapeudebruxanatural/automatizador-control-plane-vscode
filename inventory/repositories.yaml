# Achados que merecem atencao do dono, em ordem de risco.
findings:
  - id: F-001
    severity: alta
    title: novacena-motion e publico e tem pipeline de deploy para a VPS
    detail: >-
      Repositorio publico com environment `production` e workflow "Deploy VPS".
      Repositorio publico com pipeline de producao expoe a topologia de deploy
      e amplia a superficie de ataque. Os segredos em si ficam em GitHub
      Secrets (nao inspecionados aqui), mas nomes de host, caminhos e etapas
      ficam visiveis.
    action: Revisar se a visibilidade publica e intencional.

  - id: F-002
    severity: media
    title: cinco repositorios sem cliente associado
    detail: >-
      4cadeiras, malta-sertaneja, gabriel-gadelha-casamentos, chay-portal e
      encantaria_artesanal nao correspondem a nenhum slug de cliente conhecido.
      Sao 5 de 14 repositorios sem dono declarado.
    action: Sessao de triagem com o dono para atribuir ou arquivar.

  - id: F-003
    severity: media
    title: garbo e publico e tem um .zip versionado na raiz
    detail: >-
      O arquivo garbo-eventos.zip esta versionado em repositorio publico.
      Arquivos compactados versionados costumam carregar conteudo que ninguem
      revisou — inclusive credenciais e dados pessoais.
    action: Inspecionar o conteudo do zip antes de qualquer outra decisao.

  - id: F-004
    severity: baixa
    title: meu-projeto parece duplicata de gaveta-monitor
    detail: >-
      Nome generico, publico, sem README, com um diretorio "MONITOR GAVETA" na
      raiz. Provavel rascunho do repositorio privado gaveta-monitor.
    action: Confirmar e arquivar se for redundante.

  - id: F-005
    severity: media
    title: encantaria_artesanal esta em producao e nao tem cliente atribuido
    detail: >-
      Revisado em 2026-08-04. A leitura inicial (so metadados do GitHub) sugeria
      commit acidental de diretorio. O inventario da VPS mostrou stack
      `encantaria` em producao ha ~6 semanas, com Directus 11 e PostgreSQL 16.
      Projeto real, ativo, sem dono declarado no catalogo de clientes.
    action: >-
      Perguntar ao dono a quem pertence, criar o cliente correspondente e
      reestruturar o repositorio (a raiz aninhada continua sendo um problema).

  - id: F-006
    severity: media
    title: servicos em producao sem repositorio conhecido
    detail: >-
      `novacena-editais` (web + worker, com imagens proprias novacena-editais:v3
      e novacena-editais-tools:v2) e `novacena-propostas` rodam na VPS e nao
      correspondem a nenhum repositorio do GitHub de dadocruz.
      Ou o codigo esta em outro lugar, ou nao esta versionado — e nesse caso
      existe apenas dentro de uma imagem Docker, num host sem backup verificado.
    action: Localizar o codigo-fonte. Se nao existir, versiona-lo com urgencia.
