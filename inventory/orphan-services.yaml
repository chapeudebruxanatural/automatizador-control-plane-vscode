    detail: >-
      Sem impacto funcional: o Traefik atende 80/443 e os nginx que importam
      rodam em container. Residuo de topologia anterior. Existe configuracao
      novacena-motion em /etc/nginx/sites-enabled.
    risk: Gera alarme falso em qualquer monitoramento que olhe systemctl
    action: Remover ou documentar como inativo intencional
    approval: nivel-1
    verificationStatus: verified
    lastVerifiedAt: 2026-08-05

