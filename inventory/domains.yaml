# =============================================================================
# inventory/domains.yaml — dominios, DNS e roteamento
# =============================================================================
# ATUALIZADO em 2026-08-05 com o roteamento REAL do Traefik. O que antes era
# lacuna total agora tem duas camadas:
#
#   - DESTINO (dominio -> servico): VERIFICADO, lido das regras do Traefik.
#   - ORIGEM (dominio -> zona DNS):  VERIFICADA nas 8 zonas da conta Cloudflare.
#
# Zonas relatadas pelo dono: inventory/cloudflare.yaml
# =============================================================================

meta:
  collectedAt: 2026-08-09
  routingSource: "regras de roteamento do Traefik (projecao fixa, apenas labels)"
  dnsSource: "Cloudflare API somente leitura; 8 zonas e 14 registros"
  changesMade: 0

# -----------------------------------------------------------------------------
# PLATAFORMA INTERNA — automatizadoria.cloud
# -----------------------------------------------------------------------------
platformDomains:
  - domain: automatizadoria.cloud
    client: automatizadoria
    dnsProvider: unknown
    dnsProviderNote: "confirmado que NAO esta na conta Cloudflare e6d7a4863004885bdae7e63bbec5e1f7"
    servedBy: VPS nvvps (Traefik)
    tls: "Traefik, volume volume_swarm_certificates"
    verificationStatus: verified
    lastVerifiedAt: 2026-08-05
    subdomains:
      - { host: "automatizadoria.cloud", service: automatizadoria-site, role: site institucional/conformidade, exposure: publico }
      - { host: "www.automatizadoria.cloud", service: automatizadoria-site, role: alias }
      - { host: "n8n.automatizadoria.cloud", service: n8n_n8n_editor, role: editor de workflows, exposure: "publico — deveria ser restrito" }
      - { host: "webhook.automatizadoria.cloud", service: n8n_n8n_webhook, role: recepcao de webhooks, path: /webhook, exposure: "publico por necessidade" }
      - { host: "chatwoot.automatizadoria.cloud", service: chatwoot_chatwoot_app, role: atendimento }
      - { host: "evo.automatizadoria.cloud", service: evolution_evolution_api, role: "gateway de WhatsApp", exposure: "publico — deveria ser restrito" }
      - { host: "tpb.automatizadoria.cloud", service: typebot_typebot_builder, role: construtor de chatbot }
      - { host: "bot.automatizadoria.cloud", service: typebot_typebot_viewer, role: chatbot publicado, exposure: publico }
      - { host: "noco.automatizadoria.cloud", service: nocodb_nocodb, role: banco no-code }
      - { host: "minio.automatizadoria.cloud", service: minio_minio, role: console do MinIO, exposure: "publico — deveria ser restrito" }
      - { host: "s3.automatizadoria.cloud", service: minio_minio, role: endpoint S3 }
      - { host: "portainer.automatizadoria.cloud", service: portainer_portainer, role: painel de containers, exposure: "publico — deveria ser restrito" }

    securityObservation: >-
      Cinco paineis administrativos estao em subdominio publico: n8n, Portainer,
      MinIO console, Typebot builder e a Evolution API. Cada um deles, se
      comprometido, da controle amplo — o Portainer da controle total do Docker,
      e a Evolution API fala com clientes por WhatsApp.
      NAO foi verificado se ha autenticacao adicional (Basic Auth, Cloudflare
      Access, allowlist de IP) na frente deles. Verificar e, se nao houver,
      tratar como prioridade.

# -----------------------------------------------------------------------------
# NOVACENA — um dominio, quatro aplicacoes por caminho
# -----------------------------------------------------------------------------
  - domain: estudionovacena.com
    client: novacena
    dnsProvider: unknown
    dnsProviderNote: "confirmado que NAO esta na conta Cloudflare e6d7a4863004885bdae7e63bbec5e1f7"
    servedBy: VPS nvvps (Traefik)
    verificationStatus: verified
    lastVerifiedAt: 2026-08-05
    aliases: ["www.estudionovacena.com", "srv1106082.hstgr.cloud"]
    pathRouting:
      - { path: "/", service: novacena-motion, repository: novacena-motion }
      - { path: "/editais", service: novacena-editais_web, repository: null, note: "SEM repositorio conhecido" }
      - { path: "/music", service: novacena_music_nginx, repository: novacena-music, note: "stack Swarm; o Compose nao recebe trafego" }
      - { path: "/leonardo", service: novacena-propostas, repository: null, note: "proposta comercial; SEM repositorio conhecido" }
    observation: >-
      Quatro aplicacoes distintas compartilham um dominio por prefixo de
      caminho. Funciona, mas acopla o ciclo de vida delas: uma mudanca de
      roteamento afeta todas, e nao ha isolamento de cookie ou de origem entre
      elas.

