  - { repository: garbo, evidence: "_redirects, sitemap.xml", platform: cloudflare, domain: unknown }
  - { repository: 4cadeiras, evidence: "_headers, _redirects, sitemap.xml", platform: cloudflare, domain: unknown }
  - { repository: gabriel-gadelha-casamentos, evidence: "_headers, sitemap.xml", platform: cloudflare, domain: unknown }
  - { repository: chay-portal, evidence: "wrangler.toml, functions/", platform: cloudflare-workers, domain: unknown }
  - { repository: vivere, evidence: "open-next.config.ts", platform: cloudflare-workers, domain: unknown }
  - { repository: malta-sertaneja, evidence: "site estatico", platform: unknown, domain: unknown }

