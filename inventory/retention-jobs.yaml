      change: "trocar `-af` por poda seletiva que preserva as N imagens mais recentes por servico"
      approval: nivel-2
    - target: crond-image-prune
      change: "consolidar com a anterior — hoje sao duas politicas independentes"
      approval: nivel-2
    - target: crond-image-prune
      change: "parar de escrever em /dev/null; registrar o que foi removido"
      approval: nivel-2
